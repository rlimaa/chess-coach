[project]
name = "chess-coach"
version = "0.1.0"
description = "Personal chess coach: chess.com games, Stockfish analysis and coaching reports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rich>=14.0",
    "typer>=0.16",
]

[project.scripts]
coach = "chesscoach.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesscoach"]

# --- Lint & format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PT", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

# --- Types -------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: needs the real Stockfish binary (runs inside the Docker image)"]

[tool.coverage.run]
source = ["chesscoach"]
branch = true

# --- Architecture rules (lint-imports) ---------------------------------------
[tool.importlinter]
root_package = "chesscoach"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture: dependencies point inward"
type = "layers"
layers = [
    "chesscoach.interfaces",
    "chesscoach.container",
    "chesscoach.config",
    "chesscoach.adapters",
    "chesscoach.application",
    "chesscoach.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of infrastructure libraries"
type = "forbidden"
source_modules = ["chesscoach.domain", "chesscoach.application"]
forbidden_modules = ["httpx", "typer", "rich", "pydantic_settings"]
