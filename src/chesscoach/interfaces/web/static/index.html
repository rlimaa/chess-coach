<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Coach</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">Chess Coach</h1>
        <nav class="app-nav">
          <a href="#/overview" class="nav-link" data-route="overview">Overview</a>
          <a href="#/games" class="nav-link" data-route="games">Games</a>
          <a href="#/puzzles" class="nav-link" data-route="puzzles">Puzzles</a>
          <a href="#/progress" class="nav-link" data-route="progress">Progress</a>
        </nav>
      </div>
      <div class="header-controls">
        <div class="time-class-selector">
          <div id="timeClassButtons" class="segmented-control"></div>
        </div>
      </div>
    </header>
    <main id="main" class="app-main"></main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
